[project]
name = "bowlbyte-api"
version = "0.1.0"
description = "BowlByte canteen API. Authentication, sessions, and role checks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "celery==5.6.3",
    "cryptography==50.0.2",
    "email-validator==2.3.0",
    "fastapi==0.143.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "pywebpush==2.5.0",
    "redis==8.1.0",
    "sqlalchemy==2.1.4",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: requires a reachable PostgreSQL and Redis from DATABASE_URL and REDIS_URL",
]
